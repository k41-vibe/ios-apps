name: LCProbe
options:
  bundleIdPrefix: com.rutoi
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
targets:
  LCProbe:
    type: application
    platform: iOS
    sources:
      - Sources
      # アプリ内アップデート(shared/Updater.swift)。他のアプリも同じ 1 行で載る
      - path: ../../shared
        name: shared
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: LCProbe
        # 版は CI が xcodebuild の引数で注入する(docs/VERSIONING.md)。手元ビルドは 0.0.0 (0) local
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LCGitCommit: $(LC_GIT_SHA)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rutoi.lcprobe
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "0"
        LC_GIT_SHA: "local"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        ENABLE_BITCODE: "NO"
        # shared/JITBrk.h を Swift から見えるようにする
        SWIFT_OBJC_BRIDGING_HEADER: Sources/LCProbe-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../../shared"
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/Frameworks"
