name: WatchTunes
options:
  bundleIdPrefix: com.rutoi
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
targets:
  WatchTunes:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: WatchTunes
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rutoi.watchtunes
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        ENABLE_BITCODE: "NO"
  # 時計アプリ。postbuild.sh が watchos SDK で建てて <App>.app/Watch/ に埋め込む
  WatchTunesWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - WatchSources
    info:
      path: WatchInfo.plist
      properties:
        CFBundleDisplayName: WatchTunes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.rutoi.watchtunes
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rutoi.watchtunes.watchkitapp
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "0"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
