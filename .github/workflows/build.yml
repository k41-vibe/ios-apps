name: build-ipa

on:
  # 開発ビルド: build.ps1 の workflow_dispatch で指定アプリだけ建てる(ブランチ push では動かさない)
  workflow_dispatch:
    inputs:
      app:
        description: "apps/ 配下のアプリ名 (空なら全部)"
        required: false
        default: ""
  # リリース: <app小文字>-vX.Y.Z のタグ push で、そのアプリだけ建てて GitHub Release を発行(docs/VERSIONING.md)
  push:
    tags: ["*-v[0-9]*"]

permissions:
  contents: write   # Release の作成に必要(タグ push 時のみ使う)

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.ls.outputs.apps }}
      stage: ${{ steps.ls.outputs.stage }}
      release: ${{ steps.ls.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: ls
        shell: bash
        run: |
          release=""
          if [ "${{ github.ref_type }}" = "tag" ]; then
            # タグ xioslite-v0.1.0 -> app=XiOSLite(大小無視で apps/ を引く), release=0.1.0
            ref="${{ github.ref_name }}"
            prefix="${ref%%-v*}"
            release="${ref##*-v}"
            want=""
            for a in $(ls apps); do
              if [ "$(echo "$a" | tr 'A-Z' 'a-z')" = "$prefix" ]; then want="$a"; fi
            done
            [ -n "$want" ] || { echo "::error::タグ $ref に対応するアプリが apps/ にない"; exit 1; }
            apps=$(printf '["%s"]' "$want")
          else
            want="${{ github.event.inputs.app }}"
            if [ -n "$want" ]; then
              apps=$(printf '["%s"]' "$want")
            else
              apps=$(ls -d apps/*/ | xargs -n1 basename | jq -R . | jq -sc .)
            fi
          fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          # apps/<app>/stage.txt = needs the xiOS staged tree (ubuntu "stage" job)
          stage=false
          for a in $(echo "$apps" | jq -r '.[]'); do
            if [ -f "apps/$a/stage.txt" ]; then stage=true; fi
          done
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "building: $apps (stage job: $stage)"

  # xiOS .deb closure -> relinked Mach-Os + jb/ data tree (tools/xios/stage.py), on Linux to
  # keep the macOS minutes for the Swift build. Only when some app has stage.txt.
  stage:
    needs: list
    if: needs.list.outputs.stage == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install zstandard
      - name: Restore .deb cache
        uses: actions/cache@v4
        with:
          path: .deb-cache
          key: xios-debs-${{ hashFiles('tools/xios/closure_sha256.txt') }}
      - name: Stage xiOS closure
        run: |
          python tools/xios/stage.py \
            --urls tools/xios/closure_urls.txt \
            --sha tools/xios/closure_sha256.txt \
            --cache .deb-cache \
            --out stage \
            --clean --symlinks never
          du -sh stage/Frameworks stage/jb
      - name: Upload staged tree
        uses: actions/upload-artifact@v4
        with:
          name: xios-stage
          path: stage
          if-no-files-found: error

  build:
    needs: [list, stage]
    # run even when the stage job was skipped (apps without stage.txt), never when it failed
    if: ${{ !cancelled() && needs.list.result == 'success' && (needs.stage.result == 'success' || needs.stage.result == 'skipped') }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.list.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: apps/${{ matrix.app }}
        run: xcodegen generate

      # 版番号(docs/VERSIONING.md): リリースはタグの X.Y.Z、開発ビルドは 0.0.YYYYMMDD。ビルド番号は run 番号
      - name: Version
        id: ver
        run: |
          rel="${{ needs.list.outputs.release }}"
          if [ -n "$rel" ]; then marketing="$rel"; else marketing="0.0.$(date -u +%Y%m%d)"; fi
          echo "marketing=$marketing" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "version $marketing build ${{ github.run_number }} sha $(git rev-parse --short HEAD)"

      - name: Build (unsigned)
        working-directory: apps/${{ matrix.app }}
        run: |
          set -o pipefail
          xcodebuild \
            -project "${{ matrix.app }}.xcodeproj" \
            -scheme "${{ matrix.app }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.ver.outputs.marketing }}" \
            CURRENT_PROJECT_VERSION="${{ steps.ver.outputs.build }}" \
            LC_GIT_SHA="${{ steps.ver.outputs.sha }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log | (grep -E "error:|warning: .*Swift|\*\* BUILD" || true)
          app="build/Build/Products/Release-iphoneos/${{ matrix.app }}.app"
          test -d "$app"
          test -x "$app/${{ matrix.app }}" || { echo "::error::main executable missing in $app"; exit 1; }

      - name: Download staged tree (apps with stage.txt)
        if: hashFiles(format('apps/{0}/stage.txt', matrix.app)) != ''
        uses: actions/download-artifact@v4
        with:
          name: xios-stage
          path: stage

      - name: Post-build hook (apps/<app>/postbuild.sh)
        working-directory: apps/${{ matrix.app }}
        run: |
          if [ -f postbuild.sh ]; then
            if [ -f stage.txt ]; then
              export STAGE_DIR="$GITHUB_WORKSPACE/stage"
              test -d "$STAGE_DIR/Frameworks" || { echo "::error::staged tree missing at $STAGE_DIR"; exit 1; }
            fi
            APP_DIR="$PWD/build/Build/Products/Release-iphoneos/${{ matrix.app }}.app" bash postbuild.sh
          else
            echo "no postbuild.sh"
          fi

      - name: Package .ipa
        working-directory: apps/${{ matrix.app }}
        run: |
          rm -rf Payload && mkdir Payload
          cp -R "build/Build/Products/Release-iphoneos/${{ matrix.app }}.app" Payload/
          if [ -f stage.txt ]; then
            zip -qr -y "${{ matrix.app }}.ipa" Payload   # -y: store symlinks as symlinks
          else
            zip -qr "${{ matrix.app }}.ipa" Payload
          fi
          ls -la "${{ matrix.app }}.ipa"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-build.log
          path: apps/${{ matrix.app }}/build.log
          if-no-files-found: ignore

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}.ipa
          path: apps/${{ matrix.app }}/${{ matrix.app }}.ipa
          if-no-files-found: error

      # ---- ここから下はタグ push(リリース)のときだけ ----
      # 版ごとに分ける(資産名が <App>-vX.Y.Z.ipa)と、1 か所にまとめる(リリースはアプリごとに 1 つ)の両立。
      # 版そのものを指すのは git タグ <app>-vX.Y.Z のほう(ソースを永久に辿れる)。
      - name: Publish (アプリごとに 1 リリース、資産は版ごと)
        if: needs.list.outputs.release != ''
        working-directory: apps/${{ matrix.app }}
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ matrix.app }}
          VER: ${{ needs.list.outputs.release }}
          BUILD: ${{ steps.ver.outputs.build }}
          SHA: ${{ steps.ver.outputs.sha }}
          KEEP: "6"
        run: |
          set -euo pipefail
          tag=$(echo "$APP" | tr 'A-Z' 'a-z')
          asset="$APP-v$VER.ipa"
          cp "$APP.ipa" "$asset"
          sha256=$(shasum -a 256 "$asset" | cut -d' ' -f1)

          # この版の節(CHANGELOG から抜く)
          {
            echo "### v$VER — $(date -u +%Y-%m-%d) — \`$asset\`"
            echo
            if [ -f CHANGELOG.md ]; then
              awk -v v="$VER" '$0 ~ "^## \\[" v "\\]" { on=1; next } on && /^## \[/ { on=0 } on { print }' CHANGELOG.md
            fi
            echo "- SHA-256: \`$sha256\`  /  build $BUILD  /  commit \`$SHA\`"
            echo "- source: https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}"
            echo
          } > section.md

          if ! gh release view "$tag" >/dev/null 2>&1; then
            printf '%s\n' \
              "$APP のリリース置き場。資産は版ごと(\`$APP-vX.Y.Z.ipa\`)、新しいものが上。" \
              "" \
              "未署名の .ipa。LiveContainer で取り込むと自分の証明書で署名し直される。" \
              "取り込んだ版は LiveContainer の一覧とアプリ画面に \`vX.Y.Z (build N) <commit>\` と出る。" \
              "版の決まりは [docs/VERSIONING.md](https://github.com/${{ github.repository }}/blob/main/docs/VERSIONING.md)。" \
              "" > head.md
            gh release create "$tag" --title "$APP" --notes-file head.md
          fi

          # 今回の節を先頭に足す(新しい版が上、説明の定型文は末尾に残る)
          gh release view "$tag" --json body --jq .body > body.md
          cat section.md body.md > newbody.md
          gh release edit "$tag" --notes-file newbody.md

          gh release upload "$tag" "$asset" --clobber
          echo "published $asset -> $tag"

          # 古い資産を掃除(1 つ 100MB 級なので KEEP 個まで)
          gh release view "$tag" --json assets --jq '.assets | sort_by(.updatedAt) | reverse | .[].name' > assets.txt
          tail -n +$((KEEP + 1)) assets.txt | while read -r old; do
            [ -n "$old" ] && gh release delete-asset "$tag" "$old" --yes && echo "pruned $old"
          done
          rm -f section.md head.md body.md newbody.md assets.txt "$asset"
